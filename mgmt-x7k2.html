<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aurra Home — Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --dark:    #0f0e0c;
      --darker:  #0a0908;
      --panel:   #1a1815;
      --card:    #242220;
      --border:  rgba(201,168,76,0.15);
      --gold:    #c9a84c;
      --gold2:   #e8c96a;
      --cream:   #f5f0e8;
      --text:    #d4cfc8;
      --muted:   rgba(212,207,200,0.45);
      --green:   #2ecc71;
      --red:     #e74c3c;
      --orange:  #f39c12;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Jost', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen {
      position: fixed; inset: 0; background: var(--darker);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 3rem 2.5rem;
      width: 100%; max-width: 380px;
      text-align: center;
    }
    .login-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem; font-weight: 700;
      color: var(--gold2); letter-spacing: 0.2em;
      margin-bottom: 0.3rem;
    }
    .login-sub {
      font-size: 0.6rem; letter-spacing: 0.4em;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    .login-box input {
      width: 100%; background: var(--card);
      border: 1px solid var(--border); color: var(--text);
      padding: 0.85rem 1rem; font-family: 'Jost', sans-serif;
      font-size: 0.9rem; margin-bottom: 1rem;
      outline: none; transition: border-color 0.3s;
    }
    .login-box input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%; background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--darker); border: none; padding: 0.9rem;
      font-family: 'Jost', sans-serif; font-size: 0.75rem;
      font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; transition: opacity 0.3s;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-error {
      color: var(--red); font-size: 0.78rem;
      margin-top: 1rem; display: none;
    }

    /* ── LAYOUT ── */
    #adminApp { display: none; min-height: 100vh; }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem; font-weight: 700;
      color: var(--gold2); letter-spacing: 0.15em;
    }
    .header-logo span {
      font-family: 'Jost', sans-serif;
      font-size: 0.5rem; letter-spacing: 0.3em;
      color: var(--muted); display: block;
      text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .logout-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 0.4rem 1rem;
      font-size: 0.65rem; letter-spacing: 0.15em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.3s; font-family: 'Jost', sans-serif;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    .main-content { padding: 2rem; max-width: 1100px; margin: 0 auto; }

    /* ── TABS ── */
    .tabs {
      display: flex; gap: 0.5rem; margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent; border: none;
      color: var(--muted); padding: 0.75rem 1.5rem;
      font-family: 'Jost', sans-serif; font-size: 0.72rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--gold2); border-bottom-color: var(--gold2); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── SECTION HEADER ── */
    .sec-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .sec-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 600;
      color: var(--cream); letter-spacing: 0.05em;
    }

    /* ── BUTTONS ── */
    .btn {
      padding: 0.6rem 1.4rem; font-family: 'Jost', sans-serif;
      font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      cursor: pointer; border: none; transition: all 0.3s;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--darker);
    }
    .btn-gold:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold2); }
    .btn-danger {
      background: transparent;
      border: 1px solid rgba(231,76,60,0.3);
      color: var(--red);
    }
    .btn-danger:hover { background: rgba(231,76,60,0.1); }
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.6rem; }

    /* ── PRODUCT CARDS ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      transition: border-color 0.3s;
      position: relative;
    }
    .product-card:hover { border-color: rgba(201,168,76,0.35); }
    .product-card.hidden-product { opacity: 0.5; }
    .product-card.hidden-product::after {
      content: 'HIDDEN';
      position: absolute; top: 1rem; right: 1rem;
      background: var(--red); color: white;
      font-size: 0.55rem; padding: 0.2rem 0.5rem;
      letter-spacing: 0.15em; font-weight: 600;
    }
    .card-img {
      width: 100%; height: 140px; object-fit: contain;
      background: var(--panel); margin-bottom: 1rem;
      padding: 1rem;
    }
    .card-tag {
      font-size: 0.58rem; letter-spacing: 0.25em;
      color: var(--gold); text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem; font-weight: 600;
      color: var(--cream); margin-bottom: 0.3rem;
    }
    .card-price {
      font-size: 1rem; color: var(--gold2);
      font-family: 'Cormorant Garamond', serif;
      margin-bottom: 1rem;
    }
    .card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
      z-index: 999; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
      padding: 2rem;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem; font-weight: 600; color: var(--cream);
    }
    .modal-close {
      background: transparent; border: none;
      color: var(--muted); font-size: 1.2rem;
      cursor: pointer; transition: color 0.3s; line-height: 1;
    }
    .modal-close:hover { color: var(--red); }

    /* ── FORM ── */
    .form-group { margin-bottom: 1.2rem; }
    .form-label {
      display: block; font-size: 0.65rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.5rem;
    }
    .form-control {
      width: 100%; background: var(--card);
      border: 1px solid var(--border); color: var(--text);
      padding: 0.75rem 1rem; font-family: 'Jost', sans-serif;
      font-size: 0.88rem; outline: none;
      transition: border-color 0.3s;
    }
    .form-control:focus { border-color: var(--gold); }
    textarea.form-control { resize: vertical; min-height: 90px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .toggle-group {
      display: flex; align-items: center; gap: 1rem;
      background: var(--card); border: 1px solid var(--border);
      padding: 0.75rem 1rem;
    }
    .toggle-label { font-size: 0.85rem; color: var(--text); flex: 1; }
    .toggle {
      position: relative; width: 44px; height: 24px;
      cursor: pointer; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border); border-radius: 24px;
      transition: background 0.3s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--muted); top: 3px; left: 3px;
      transition: transform 0.3s, background 0.3s;
    }
    .toggle input:checked + .toggle-slider { background: rgba(46,204,113,0.3); }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
      background: var(--green);
    }
    .features-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .feature-item { display: flex; gap: 0.5rem; align-items: center; }
    .feature-item input { flex: 1; }
    .feature-remove {
      background: transparent; border: none;
      color: var(--red); cursor: pointer; font-size: 1rem;
      padding: 0 0.3rem; line-height: 1;
    }
    .add-feature-btn {
      background: transparent; border: 1px dashed var(--border);
      color: var(--muted); padding: 0.5rem; width: 100%;
      font-family: 'Jost', sans-serif; font-size: 0.72rem;
      letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s;
      margin-top: 0.5rem;
    }
    .add-feature-btn:hover { border-color: var(--gold); color: var(--gold2); }
    .modal-footer {
      display: flex; gap: 1rem; justify-content: flex-end;
      margin-top: 1.5rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--panel); border: 1px solid var(--border);
      padding: 1rem 1.5rem; font-size: 0.82rem;
      transform: translateY(100px); opacity: 0;
      transition: all 0.4s; z-index: 9999;
      min-width: 220px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: var(--red);   color: var(--red);   }

    /* ── LOADING ── */
    .loading {
      text-align: center; padding: 4rem;
      color: var(--muted); font-size: 0.82rem;
      letter-spacing: 0.1em;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY ── */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state p { font-size: 0.82rem; letter-spacing: 0.05em; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .main-content { padding: 1rem; }
      .form-row { grid-template-columns: 1fr; }
      .products-grid { grid-template-columns: 1fr; }
      header { padding: 1rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">AURRA</div>
    <div class="login-sub">Admin Panel</div>
    <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Login</button>
    <div class="login-error" id="loginError">Galat password — dobara try karo</div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <header>
    <div class="header-logo">
      AURRA
      <span>Admin Panel</span>
    </div>
    <div class="header-right">
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="main-content">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('products')">Products</button>
    </div>

    <!-- PRODUCTS TAB -->
    <div class="tab-content active" id="tab-products">
      <div class="sec-header">
        <div class="sec-title">Products</div>
        <button class="btn btn-gold" onclick="openAddModal()">+ Add Product</button>
      </div>
      <div id="productsList">
        <div class="loading">
          <div class="spinner"></div>
          Loading products...
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add Product</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <input type="hidden" id="editId"/>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Product Name</label>
        <input type="text" class="form-control" id="editName" placeholder="Golden Aura"/>
      </div>
      <div class="form-group">
        <label class="form-label">Price (Rs.)</label>
        <input type="number" class="form-control" id="editPrice" placeholder="8500"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Tag / Collection Label</label>
      <input type="text" class="form-control" id="editTag" placeholder="Collection 01 — PVD Golden"/>
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-control" id="editDesc" placeholder="Product description..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Main Image Filename</label>
      <input type="text" class="form-control" id="editImage" placeholder="Golden_Aura.png"/>
      <div style="font-size:0.62rem; color:var(--muted); margin-top:0.5rem; line-height:1.6;">
        Extra images GitHub pe same naam se upload karo:<br/>
        <span style="color:var(--gold); font-family:monospace;">Golden_Aura_2.png, Golden_Aura_3.png, Golden_Aura_4.png</span><br/>
        (Main image ka naam base hai — _2, _3, _4 add karo)
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Features</label>
      <div class="features-list" id="featuresList"></div>
      <button class="add-feature-btn" onclick="addFeatureRow()">+ Feature add karo</button>
    </div>

    <div class="form-group">
      <div class="toggle-group">
        <span class="toggle-label">Website pe visible</span>
        <label class="toggle">
          <input type="checkbox" id="editVisible" checked/>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  // ── Config ──
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhks9B1vWeg1hcaxyPXH1BFszflzpQQ0WTIh3FzjmyaayLTLOfe7kedqKzarHYgtNQ/exec';
  const ADMIN_PASS = 'aurra2025'; // Password — change kar sakte ho

  // ── Login ──
  function doLogin() {
    const val = document.getElementById('passwordInput').value;
    if (val === ADMIN_PASS) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      loadProducts();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('passwordInput').value = '';
    }
  }

  function doLogout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminApp').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  // ── Tabs ──
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector('[onclick="switchTab(\'' + name + '\')"]').classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  // ── Toast ──
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    setTimeout(() => { t.className = ''; }, 3000);
  }

  // ── JSONP helper ──
  let cbCount = 0;
  function jsonpGet(params) {
    return new Promise((resolve, reject) => {
      const cbName = '__aurra_cb_' + (++cbCount);
      params.callback = cbName;
      const qs = Object.entries(params).map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
      window[cbName] = function(data) {
        delete window[cbName];
        const s = document.getElementById('jsonp-' + cbName);
        if (s) s.remove();
        resolve(data);
      };
      const script = document.createElement('script');
      script.id  = 'jsonp-' + cbName;
      script.src = SCRIPT_URL + '?' + qs;
      script.onerror = () => reject(new Error('JSONP failed'));
      document.body.appendChild(script);
      setTimeout(() => reject(new Error('Timeout')), 15000);
    });
  }

  function postData(body) {
    return fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(body)
    }).then(r => r.json());
  }

  // ── Load products ──
  let allProducts = [];

  async function loadProducts() {
    document.getElementById('productsList').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    try {
      const res = await jsonpGet({action: 'getProducts', includeHidden: 'true'});
      if (res.success) {
        allProducts = res.products;
        renderProducts();
      } else {
        showToast('Load failed: ' + res.error, 'error');
      }
    } catch(err) {
      document.getElementById('productsList').innerHTML = '<div class="empty-state"><p>Load nahi ho saka. Script URL check karo.</p></div>';
      showToast('Error: ' + err.message, 'error');
    }
  }

  function renderProducts() {
    const container = document.getElementById('productsList');
    if (!allProducts.length) {
      container.innerHTML = '<div class="empty-state"><p>Koi product nahi mila.</p></div>';
      return;
    }
    container.innerHTML = '<div class="products-grid">' +
      allProducts.map(p => `
        <div class="product-card ${p.visible ? '' : 'hidden-product'}">
          <img class="card-img" src="${p.image}" alt="${p.name}" onerror="this.style.background='#2a2825';this.style.padding='2rem'"/>
          <div class="card-tag">${p.tag}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-price">Rs. ${parseInt(p.price).toLocaleString()} <small style="font-size:0.7rem;color:var(--muted)">/ ${p.unit}</small></div>
          <div class="card-actions">
            <button class="btn btn-outline btn-sm" onclick="openEditModal('${p.id}')">✎ Edit</button>
            <button class="btn btn-outline btn-sm" onclick="toggleVisible('${p.id}', ${p.visible})">${p.visible ? '👁 Hide' : '👁 Show'}</button>
            <button class="btn btn-danger btn-sm" onclick="confirmDelete('${p.id}', '${p.name}')">✕ Delete</button>
          </div>
        </div>
      `).join('') + '</div>';
  }

  // ── Toggle visibility ──
  async function toggleVisible(id, currentVisible) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    product.visible = !currentVisible;
    try {
      await postData({action: 'saveProduct', product: product});
      showToast(product.name + (product.visible ? ' visible kar diya' : ' hide kar diya'));
      loadProducts();
    } catch(err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  // ── Delete ──
  async function confirmDelete(id, name) {
    if (!confirm(name + ' ko delete karna chahte ho? Yeh wapas nahi aayega.')) return;
    try {
      await postData({action: 'deleteProduct', id: id});
      showToast(name + ' delete ho gaya');
      loadProducts();
    } catch(err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  // ── Modal ──
  function openAddModal() {
    document.getElementById('modalTitle').textContent = 'Add Product';
    document.getElementById('editId').value    = '';
    document.getElementById('editName').value  = '';
    document.getElementById('editPrice').value = '';
    document.getElementById('editTag').value   = '';
    document.getElementById('editDesc').value  = '';
    document.getElementById('editImage').value = '';
    document.getElementById('editVisible').checked = true;
    renderFeatures([]);
    document.getElementById('productModal').classList.add('open');
  }

  function openEditModal(id) {
    const p = allProducts.find(p => p.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent = 'Edit Product';
    document.getElementById('editId').value    = p.id;
    document.getElementById('editName').value  = p.name;
    document.getElementById('editPrice').value = p.price;
    document.getElementById('editTag').value   = p.tag;
    document.getElementById('editDesc').value  = p.description;
    document.getElementById('editImage').value = p.image;
    document.getElementById('editVisible').checked = p.visible;
    renderFeatures(p.features || []);
    document.getElementById('productModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('productModal').classList.remove('open');
  }

  // ── Features ──
  function renderFeatures(features) {
    const list = document.getElementById('featuresList');
    list.innerHTML = features.map((f, i) => `
      <div class="feature-item">
        <input type="text" class="form-control" value="${f}" placeholder="Feature ${i+1}"/>
        <button class="feature-remove" onclick="this.parentElement.remove()">✕</button>
      </div>
    `).join('');
  }

  function addFeatureRow() {
    const list = document.getElementById('featuresList');
    const div = document.createElement('div');
    div.className = 'feature-item';
    div.innerHTML = '<input type="text" class="form-control" placeholder="Naya feature..."/><button class="feature-remove" onclick="this.parentElement.remove()">✕</button>';
    list.appendChild(div);
    div.querySelector('input').focus();
  }

  // ── Save product ──
  async function saveProduct() {
    const id      = document.getElementById('editId').value;
    const name    = document.getElementById('editName').value.trim();
    const price   = document.getElementById('editPrice').value.trim();
    const tag     = document.getElementById('editTag').value.trim();
    const desc    = document.getElementById('editDesc').value.trim();
    const image   = document.getElementById('editImage').value.trim();
    const visible = document.getElementById('editVisible').checked;
    const features = Array.from(document.querySelectorAll('#featuresList .feature-item input'))
                          .map(i => i.value.trim()).filter(Boolean);

    if (!name || !price) {
      showToast('Naam aur price zaroor bhari honi chahiye', 'error');
      return;
    }

    const product = { id, name, price, tag, description: desc, image, visible, features, unit: '3 Pcs Set' };

    try {
      const res = await postData({action: 'saveProduct', product});
      if (res.success) {
        showToast(res.action === 'created' ? 'Product add ho gaya!' : 'Product update ho gaya!');
        closeModal();
        loadProducts();
      } else {
        showToast('Save failed: ' + res.error, 'error');
      }
    } catch(err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  // Close modal on overlay click
  document.getElementById('productModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
</body>
</html>
